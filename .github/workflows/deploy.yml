name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  # The Ko-fi goal is read from Ko-fi at build time, so a daily rebuild is
  # what keeps the progress bar on the site current without anyone pushing.
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Never fails the build: a goal page that cannot be read keeps the
      # committed value and the date it was read is shown on the site.
      - name: Read the Ko-fi goal
        run: npm run goal:sync

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
