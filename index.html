<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!--
      Page head. The tags below are the defaults the dev server serves; the
      build replaces this whole block with the head of each route (see
      scripts/prerender.mjs and src/lib/head.ts). data-seo marks the tags the
      SEO component owns, so a page change in the browser replaces them instead
      of adding a second copy.
    -->
    <!--head:start-->
    <title data-seo>Zeqou — Software, built as an ecosystem.</title>
    <meta
      data-seo
      name="description"
      content="One service. Many apps. Zeqou is a growing collection of focused applications designed to work beautifully on their own — and together. Free for Windows, macOS and Linux."
    />
    <link data-seo rel="canonical" href="%BASE_URL%" />
    <meta data-seo property="og:type" content="website" />
    <meta data-seo property="og:site_name" content="Zeqou" />
    <meta data-seo property="og:title" content="Zeqou — Software, built as an ecosystem." />
    <meta
      data-seo
      property="og:description"
      content="One service. Many apps. Zeqou is a growing collection of focused applications designed to work beautifully on their own — and together. Free for Windows, macOS and Linux."
    />
    <meta data-seo property="og:url" content="%BASE_URL%" />
    <meta data-seo property="og:image" content="%BASE_URL%og.png" />
    <meta data-seo property="og:image:width" content="1200" />
    <meta data-seo property="og:image:height" content="630" />
    <meta data-seo name="twitter:card" content="summary_large_image" />
    <meta data-seo name="twitter:title" content="Zeqou — Software, built as an ecosystem." />
    <meta
      data-seo
      name="twitter:description"
      content="One service. Many apps. Zeqou is a growing collection of focused applications designed to work beautifully on their own — and together. Free for Windows, macOS and Linux."
    />
    <meta data-seo name="twitter:image" content="%BASE_URL%og.png" />
    <!--head:end-->

    <!-- Favicons: Zeqou X brand mark -->
    <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <meta
      name="keywords"
      content="Zeqou, Zeqou Harness, ZeqouXChat, ZeqouXTraining, software ecosystem, developer tools, AI workspace, fine-tuning, LoRA, MCP"
    />
    <meta name="author" content="Zeqou" />

    <!--
      Analytics: Umami — cookie-free, no personal data, nothing visible on the
      page. Restricted to the production host, so local development, previews
      and the deploy runner's checks never send a visit. Update data-domains if
      the site ever moves to a custom domain. Page changes are reported by the
      tracker itself; nothing in src/ calls it.
    -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="2211bc7c-53b3-45bb-8adc-dc4bacb119bb"
      data-domains="mishaadevv.github.io"
      data-do-not-track="true"
    ></script>

    <!--
      Before first paint: mark that scripts are running (the scroll-in animation
      only hides content when JavaScript can reveal it again), rewrite links
      that still use the old hash routes, and set the theme. Mirrors
      ThemeContext logic.
    -->
    <script>
      document.documentElement.classList.add('js');

      try {
        if (window.location.hash.indexOf('#/') === 0) {
          // #/apps/harness was the URL before the site gained real paths.
          var base = window.location.pathname.replace(/index\.html$/, '');
          window.history.replaceState(
            null,
            '',
            base + window.location.hash.slice(2) + window.location.search,
          );
        }
      } catch (e) {}

      try {
        var zeqouTheme = localStorage.getItem('zeqou-theme');
        if (zeqouTheme !== 'dark' && zeqouTheme !== 'light') {
          zeqouTheme = window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
        }
        document.documentElement.dataset.theme = zeqouTheme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
