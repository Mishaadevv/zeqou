<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeqou — Software, built as an ecosystem.</title>
    <meta
      name="description"
      content="Zeqou is a growing collection of focused applications designed to work beautifully on their own — and together."
    />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Canonical: replace with the production domain after deployment. -->
    <!-- <link rel="canonical" href="https://zeqou.github.io/" /> -->

    <!-- Favicons: Zeqou X brand mark -->
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zeqou" />
    <meta property="og:title" content="Zeqou — Software, built as an ecosystem." />
    <meta
      property="og:description"
      content="Zeqou is a growing collection of focused applications designed to work beautifully on their own — and together."
    />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zeqou X brand mark with the word ZEQOU" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zeqou — Software, built as an ecosystem." />
    <meta
      name="twitter:description"
      content="Zeqou is a growing collection of focused applications designed to work beautifully on their own — and together."
    />
    <meta name="twitter:image" content="./og.png" />

    <meta
      name="keywords"
      content="Zeqou, Zeqou Harness, ZeqouXChat, software ecosystem, developer tools, AI workspace, MCP"
    />
    <meta name="author" content="Zeqou" />

    <!-- Set the theme before first paint to avoid a flash. Mirrors ThemeContext logic. -->
    <script>
      try {
        var zeqouTheme = localStorage.getItem('zeqou-theme');
        if (zeqouTheme !== 'dark' && zeqouTheme !== 'light') {
          zeqouTheme = window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
        }
        document.documentElement.dataset.theme = zeqouTheme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
